name: Sendible
description: Sendible is a social media management platform for agencies, franchises,
  multi-location brands and marketing teams, headquartered in London. It schedules and
  publishes content across Instagram, Facebook, LinkedIn, X, TikTok, Threads, Bluesky,
  YouTube, Google Business Profile and WordPress, centralises replies in a Priority
  Inbox, and produces client-facing analytics reports. Sendible operates a live REST
  API at api.sendible.com/api/v1 and markets an API-led path for software integrators,
  but the public developer portal has been retired and no machine-readable contract is
  published.
