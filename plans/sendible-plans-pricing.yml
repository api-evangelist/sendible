description: >-
  Sendible sells five self-serve subscription tiers — Core, Plus, Premium, Elite
  and Enterprise — priced per month with unlimited users on every plan. Capacity
  is sold as workspaces, and each workspace bundles 6 social profiles. Yearly
  billing saves approximately 15%. All plans include a 14-day free trial with no
  card required. White labelling is a paid add-on on Elite and Enterprise only.
  Prices are published in USD, GBP and EUR; the values below are USD.
