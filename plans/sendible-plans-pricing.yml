notes:
  - White-label features require a separate add-on at $240/month, available on Advanced
    and Enterprise tiers only.
  - Daily sending caps apply across all subscription levels.
  - SSO is available exclusively on the Enterprise plan.
  - 14-day free trial available on all plans, no credit card required.
  - Annual billing provides approximately 15% savings over monthly billing.
