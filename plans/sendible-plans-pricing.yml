    description: For creators, freelancers, and one-person businesses managing a small
      number of social profiles.
    url: https://www.sendible.com/pricing
    price: 29.00
    unit: month
    currency: USD
    billingCycle: monthly
    features:
      - users: 1
      - socialProfiles: 6
      - dailySends: 100
      - smartQueues: 10
      - directPosting: true
      - engagementReplies: true
      - quickReports: true
      - cloudIntegrations: true
      - aiAssist: true
      - mobileApps: true
