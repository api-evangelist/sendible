name: Sendible Plans and Pricing
description: Sendible offers five subscription tiers for social media management,
  targeting creators through large agencies. All plans include a 14-day free trial
  with no credit card required. Annual billing saves approximately 15%.
url: https://www.sendible.com/pricing
plans:
