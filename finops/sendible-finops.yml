name: Sendible FinOps
description: >-
  Financial operations guidance for Sendible. Sendible sells a workspace-based
  subscription with unlimited users on every tier, so the cost driver is not
  seats — it is the number of workspaces (each bundling 6 social profiles) and
  the daily send ceiling attached to the tier. White labelling is a substantial
  separate add-on on Elite and Enterprise. There is no metered API pricing: API
  access carries no published quota, price or overage.
url: https://www.sendible.com/pricing
costDrivers:
  - name: Workspaces
    description: >-
      Capacity is sold in workspaces (1 on Core up to 50 on Enterprise), each
      bundling 6 social profiles. Running out of workspaces — not running out of
      seats — is what forces a tier upgrade.
    impact: high
  - name: Social profiles
    description: >-
      Profiles are allocated per workspace at 6 each, so profile demand and
      workspace demand move together. Additional workspace bundles can be added
      or removed from subscription settings without a full tier change.
    impact: high
  - name: White label add-on
    description: >-
      White labelling is available only on Elite and Enterprise, at an
      additional $349/month (Elite) or $800/month (Enterprise) — more than the
      Elite subscription itself.
    impact: high
  - name: Daily send volume
    description: >-
      Plans cap sends at 100/200/300/500 posts per day per workspace. High-volume
      publishers can hit the ceiling before they exhaust workspaces.
    impact: medium
  - name: Billing cycle
    description: >-
      Monthly billing costs roughly 15% more than yearly billing across every
      tier.
    impact: low
optimization:
  - name: Bill yearly
    description: >-
      Yearly billing is ~15% cheaper on every tier — for example Elite falls from
      $299 to $255 per month, and Enterprise from $750 to $638.
    savingsEstimate: ~15% annually
  - name: Buy workspace bundles instead of a tier upgrade
    description: >-
      Additional workspaces (with 6 profiles each) can be added to an existing
      plan from subscription settings, which is often cheaper than jumping a tier
      for capacity alone.
  - name: Audit connected profiles per workspace
    description: >-
      Disconnect inactive or redundant social profiles so workspaces are not
      consumed by dormant accounts.
  - name: Confirm the white-label requirement before committing
    description: >-
      White label is a $349–$800/month add-on on top of Elite or Enterprise;
      confirm the client-facing branding requirement is real before buying it.
  - name: Ignore seat count when sizing
    description: >-
      Every tier includes unlimited users, so adding team members, freelancers,
      stakeholders or clients does not change the bill. Size on workspaces and
      sends instead.
  - name: Use the free trial
    description: >-
      A 14-day free trial with no card required lets real workspace and send
      usage be measured before committing.
tiers:
