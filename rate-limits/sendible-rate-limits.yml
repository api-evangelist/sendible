name: Sendible Rate Limits
description: >-
  Sendible publishes PLATFORM sending limits (posts per day, per workspace) on
  its pricing page and in its help centre. It publishes NO API rate limits: there
  is no documented per-minute request ceiling, no documented burst allowance and
  no documented rate-limit response header, because Sendible no longer publishes
  API documentation at all. The limits below are the sending quotas an API caller
  will hit indirectly, not request-rate limits.
